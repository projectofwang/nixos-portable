name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled

      - name: Check Nix formatting
        run: nix fmt --no-write-lock-file -- --check $(git ls-files '*.nix')

      - name: Evaluate framework tests
        run: nix build .#checks.x86_64-linux.framework-tests --no-link --no-write-lock-file

      - name: Evaluate CI system
        run: nix eval .#nixosConfigurations.ci.config.system.build.toplevel.drvPath --no-write-lock-file

      - name: Validate flake structure
        run: nix flake show --no-write-lock-file

      - name: Validate nixos-portable CLI
        run: nix run --no-write-lock-file .#nixos-portable -- --help

      - name: Evaluate complete host/profile matrix
        run: nix eval .#lib.ciEvaluationMatrix --json --no-write-lock-file

      - name: Export CI build matrix
        id: matrix
        run: echo "matrix=$(nix eval .#lib.ciMatrix --json --no-write-lock-file)" >> "$GITHUB_OUTPUT"

  matrix:
    needs: framework
    runs-on: ${{ matrix.architecture == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.framework.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled

      - name: Build CI profile
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --no-write-lock-file

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: disabled

      - name: Build production machine
        run: nix build .#nixosConfigurations.machine.config.system.build.toplevel --no-link --no-write-lock-file
