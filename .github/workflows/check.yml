name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR checks, but let main validation finish.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting - flake
        run: nix fmt -- --check flake.nix

      - name: Check formatting - profiles
        run: nix fmt -- --check lib/profiles.nix

      - name: Check formatting - HM default
        run: nix fmt -- --check modules/home-manager/default.nix

      - name: Check formatting - IDE
        run: nix fmt -- --check modules/home-manager/ide.nix

      - name: Format AI integration and show diff
        run: |
          nix fmt -- modules/home-manager/ai-integration.nix
          git diff -- modules/home-manager/ai-integration.nix
          test -z "$(git status --short -- modules/home-manager/ai-integration.nix)"

      - name: Check formatting - browser
        run: nix fmt -- --check modules/nixos/browser/default.nix

      - name: Check formatting - graphics
        run: nix fmt -- --check modules/nixos/graphics.nix

      - name: Check formatting - AI profile
        run: nix fmt -- --check profiles/ai.nix

      - name: Check formatting - gaming
        run: nix fmt -- --check profiles/gaming.nix

      # The production host intentionally imports machine-specific hardware.
      # Do not evaluate it on a generic GitHub runner: that cannot provide the
      # real root filesystem and would make CI fail for the wrong reason.
      - name: Evaluate CI system
        run: nix eval .#nixosConfigurations.ci.config.system.build.toplevel.drvPath --no-write-lock-file

      - name: Check CI build plan
        run: nix build .#checks.x86_64-linux.ci --no-link --dry-run --no-write-lock-file

      # `nix flake check` evaluates every NixOS configuration, including the
      # production template whose real hardware file is intentionally absent.
      # The CI configuration is validated explicitly above instead.
      - name: Show flake outputs
        run: nix flake show --no-write-lock-file
