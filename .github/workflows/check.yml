name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded PR checks, but let main validation finish.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix fmt -- --check $(git ls-files '*.nix')

      - name: Evaluate CI system
        run: nix build .#checks.x86_64-linux.ci --no-link --dry-run --no-write-lock-file

      - name: Check flake
        run: nix flake check --no-build --no-write-lock-file
