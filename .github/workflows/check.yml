name: Check NixOS configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # hardware-configuration.nix is intentionally a machine-local template.
      # CI replaces it temporarily with a minimal synthetic filesystem.
      - name: Provide synthetic CI hardware
        run: |
          cat > hosts/machine/hardware-configuration.nix <<'EOF'
          { ... }:
          {
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos-ci";
              fsType = "ext4";
            };
          }
          EOF

      - name: Check flake
        run: nix flake check --no-write-lock-file --print-build-logs

      - name: Evaluate portable configuration
        run: |
          set -euo pipefail
          nix eval --no-write-lock-file .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath >/dev/null

      - name: Evaluate CI configuration
        run: |
          set -euo pipefail
          nix eval --no-write-lock-file .#nixosConfigurations.ci.config.system.build.toplevel.drvPath >/dev/null

      - name: Show flake outputs
        run: nix flake show --no-write-lock-file
