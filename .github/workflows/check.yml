# Validate every push and pull request; for example, a PR is checked without requiring access to the production machine.
name: Check

# Run checks for main pushes and proposed pull requests.
on:
  push:
    branches: [main]
  pull_request:

# Grant only read access because the workflow never writes repository state.
permissions:
  contents: read

# Cancel obsolete PR checks while keeping main-branch checks independent.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Use a standard GitHub-hosted Linux runner rather than assuming production hardware.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Fetch the exact repository revision being checked.
      - name: Check out repository
        uses: actions/checkout@v6

      # Install Nix with flakes and modern commands enabled.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Temporarily format in CI so the exact formatter output can be inspected.
      - name: Format Nix files
        run: |
          nix fmt -- $(git ls-files '*.nix')
          git diff -- flake.nix lib/hosts.nix

      # Evaluate only the hardware-independent CI system; example: production GPU hardware is never required here.
      - name: Evaluate CI system
        run: nix eval .#nixosConfigurations.ci.config.system.build.toplevel.drvPath --no-write-lock-file

      # Verify the CI build graph without downloading or building the complete system.
      - name: Check CI build plan
        run: nix build .#checks.x86_64-linux.ci --no-link --dry-run --no-write-lock-file

      # Confirm the flake exposes the expected outputs and remains structurally valid.
      - name: Show flake outputs
        run: nix flake show --no-write-lock-file
