# Validate every push and pull request; for example, the matrix checks every discovered host/profile combination.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Nix formatting
        run: nix fmt -- --check $(git ls-files '*.nix')

      - name: Evaluate CI system
        run: nix eval .#nixosConfigurations.ci.config.system.build.toplevel.drvPath --no-write-lock-file

      - name: Validate flake structure
        run: nix flake show --no-write-lock-file

      - name: Validate nixos-portable CLI
        run: nix run .#nixos-portable -- --help

      - name: Export CI matrix
        id: matrix
        run: echo "matrix=$(nix eval .#ciMatrix --json --no-write-lock-file)" >> "$GITHUB_OUTPUT"

  matrix:
    needs: framework
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.framework.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check host/profile build plan
        run: nix build ".#checks.${{ matrix.architecture }}.${{ matrix.host }}-${{ matrix.profile }}" --no-link --dry-run --no-write-lock-file
