# Pre-commit hooks for repository-wide quality checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflicts

  - repo: https://github.com/nix-community/nixfmt
    rev: v1.1.0
    hooks:
      - id: nixfmt

  - repo: local
    hooks:
      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
