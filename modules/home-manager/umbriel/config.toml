# Start the desktop panel and expose compositor behavior; for example, Noctalia starts automatically with XWayland enabled.
[general]
autostart = ["noctalia"]
xwayland = true
show_cheatsheet = true
focus_on_activate = false
honor_restored_maximize = false

# Reserve the environment section for compositor-exported variables.
[environment]

# Reserve event hooks for future compositor event handlers.
[events]

# Keep workspace behavior deterministic; for example, switching does not automatically jump between non-adjacent workspaces.
[workspaces]
back_and_forth = false
empty_above = false

# Define window decoration and opacity defaults; for example, focused windows use a 2px border and 10px corners.
[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75

# Tune blur for the compositor surfaces; for example, three optimized passes use a small radius and low noise.
[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# Tune window shadows; for example, shadows are soft with a 2px offset.
[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2

# Define pointer interaction defaults; for example, middle-click pastes the primary selection.
[input]
middle_click_paste = true
window_drag_toggle = "none"

# Define keyboard layout and repeat behavior; for example, the compositor leaves the layout unset so the system controls it.
[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

# Enable touchpad tapping; for example, a tap performs a normal click.
[input.touchpad]
tap = true

# Keep mouse movement and wheel defaults explicit; for example, wheel steps are fixed at 60.
[input.mouse]
sensitivity = 0.0
scroll_wheel_step = 60

# Keep tablet input enabled for supported devices.
[input.tablet]
enabled = true

# Define cursor presentation; for example, a 24px hardware cursor stays visible while typing.
[input.cursor]
theme = ""
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = false
hide_timeout_ms = 0

# Keep focus mouse-driven only through explicit keybinds; for example, moving the pointer does not change focus.
[input.focus]
follows_mouse = false

# Bind workspace, window, application, audio, and screenshot actions; for example, Mod+Return launches WezTerm.
[keybinds]
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Shift+1" = "window-move-to-workspace:1"
"Mod+Shift+2" = "window-move-to-workspace:2"
"Mod+Shift+3" = "window-move-to-workspace:3"
"Mod+Shift+4" = "window-move-to-workspace:4"
"Mod+Shift+5" = "window-move-to-workspace:5"
"Mod+Shift+6" = "window-move-to-workspace:6"
"Mod+Shift+7" = "window-move-to-workspace:7"
"Mod+Shift+8" = "window-move-to-workspace:8"
"Mod+Shift+9" = "window-move-to-workspace:9"
"Mod+Up" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+F" = "window-toggle-maximize"
"Mod+Q" = "window-close"
"Mod+O" = "overview-toggle"
"Mod+Return" = "spawn:wezterm"
"Mod+E" = "spawn:krusader"
"Mod+Space" = "spawn:noctalia msg panel-toggle launcher"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Comma" = "spawn:noctalia msg settings-toggle"
"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"Mod+XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"Ctrl+Shift+1" = "spawn:noctalia msg screenshot-fullscreen"
"Ctrl+Shift+2" = "spawn:noctalia msg screenshot-region"
